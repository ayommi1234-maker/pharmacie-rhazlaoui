<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-Frame-Options" content="DENY"/>
  <meta http-equiv="X-Content-Type-Options" content="nosniff"/>
  <title>Page introuvable — Pharmacie Rhazlaoui</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #003D1F 0%, #007A3D 40%, #00A651 100%);
      color: white; text-align: center; padding: 2rem;
    }
    .container { max-width: 500px; }
    h1 { font-size: 6rem; font-weight: 900; opacity: 0.3; margin-bottom: 10px; }
    h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; }
    p { font-size: 1rem; opacity: 0.8; margin-bottom: 30px; line-height: 1.6; }
    a {
      display: inline-block; padding: 12px 32px;
      background: white; color: #007A3D;
      border-radius: 50px; font-weight: 700; font-size: 0.9rem;
      text-decoration: none; transition: all 0.3s;
    }
    a:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page introuvable</h2>
    <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
    <a href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
