# ══════════════════════════════════════════════
#  PHARMACIE RHAZLAOUI — Configuration Netlify
# ══════════════════════════════════════════════

[build]
  publish = "."

# ── HEADERS DE SÉCURITÉ (appliqués à toutes les pages) ──
[[headers]]
  for = "/*"
  [headers.values]
    # Empêcher le site d'être affiché dans un iframe (anti-clickjacking)
    X-Frame-Options = "DENY"
    # Bloquer le sniffing MIME
    X-Content-Type-Options = "nosniff"
    # Protection XSS navigateur
    X-XSS-Protection = "1; mode=block"
    # Politique de referrer stricte
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Empêcher les features abusives (caméra, micro, géolocation, etc.)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    # Content Security Policy — PROTECTION MAJEURE
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://images.unsplash.com https://*.tile.openstreetmap.org; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    # Forcer HTTPS (HSTS) — 1 an
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Cross-Origin policies
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# ── CACHE — Assets statiques (images, CSS, JS) ──
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── Bloquer l'accès au panneau admin depuis le web ──
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ── Redirections ──
[[redirects]]
  from = "https://www.pharmacie-rhazlaoui.netlify.app/*"
  to = "https://pharmacie-rhazlaoui.netlify.app/:splat"
  status = 301
  force = true
