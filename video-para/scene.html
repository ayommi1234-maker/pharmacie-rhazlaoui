<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>LA PARA RHAZLAOUI — jaillissement</title>
<!--
  Animation « les lettres sortent de la mer en tournant en hélice ».
  Pilotée UNIQUEMENT par window.poser(t) : aucun requestAnimationFrame, aucune
  horloge interne. Le rendu est donc strictement reproductible image par image
  (c'est ce qui permet de capturer 30 images/s sans décalage).
-->
<style>
  :root{
    --or-clair:#fff3c4; --or:#f0c04a; --or-fonce:#a9761a; --or-vif:#ffe9a8;
    --nuit:#050b18; --mer:#0a1a33;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;overflow:hidden;background:var(--nuit)}
  #scene{position:relative;width:1080px;height:1080px;overflow:hidden;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}

  /* ── Ciel de nuit ── */
  #ciel{position:absolute;inset:0;
    background:
      radial-gradient(120% 70% at 50% -10%, #17335e 0%, #0b1b36 45%, #050b18 100%),
      linear-gradient(180deg,#071026 0%,#0a1730 60%,#040a16 100%);}

  /* ── Rayons descendants ── */
  #rayons{position:absolute;inset:-10% -20% 40% -20%;filter:blur(22px);mix-blend-mode:screen}
  .rayon{position:absolute;top:-12%;width:5%;height:120%;transform-origin:50% 0%;
    background:linear-gradient(180deg,rgba(190,225,255,.55),rgba(150,200,255,.12) 55%,transparent 85%)}

  /* ── Brume et montagnes lointaines ── */
  #montagnes{position:absolute;left:0;right:0;top:36%;height:26%;filter:blur(2.5px);opacity:.55}
  #brume{position:absolute;left:-10%;right:-10%;top:44%;height:22%;filter:blur(30px);
    background:linear-gradient(180deg,transparent,rgba(150,190,240,.28) 45%,transparent);}

  /* ── Mer ── */
  #mer{position:absolute;left:0;right:0;top:58%;bottom:0;overflow:hidden;
    background:linear-gradient(180deg,#0a1a33 0%,#061021 55%,#03080f 100%)}
  #eau{position:absolute;inset:0}
  #horizon{position:absolute;left:0;right:0;top:0;height:3px;
    background:linear-gradient(90deg,transparent,rgba(160,205,255,.6),transparent);filter:blur(1px)}

  /* ── Bloc du texte (perspective 3D) ── */
  #sol{position:absolute;left:0;right:0;top:0;bottom:0;perspective:1400px;
    perspective-origin:50% 45%}
  #titre{position:absolute;left:50%;top:38%;transform-style:preserve-3d;white-space:nowrap}
  .lettre{position:absolute;display:inline-block;transform-style:preserve-3d;
    font-weight:700;letter-spacing:.01em;
    background:linear-gradient(175deg,var(--or-clair) 0%,var(--or-vif) 18%,var(--or) 38%,
      var(--or-fonce) 52%,var(--or) 66%,var(--or-vif) 84%,#fffbe8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,200,90,.55)) drop-shadow(0 2px 3px rgba(0,0,0,.6))}

  /* ── Reflet dans l'eau ── */
  #reflet{position:absolute;left:50%;top:0;transform-style:preserve-3d;white-space:nowrap;
    opacity:.34;filter:blur(3px)}
  .lettre-r{position:absolute;display:inline-block;font-weight:700;letter-spacing:.01em;
    background:linear-gradient(0deg,transparent 0%,rgba(240,192,74,.75) 60%,#ffe9a8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}

  /* ── Ruban de lumière hélicoïdal ── */
  #ruban{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}

  /* ── Sous-titre ── */
  #sous{position:absolute;left:0;right:0;top:74%;text-align:center;
    font-size:30px;letter-spacing:.42em;text-transform:uppercase;
    color:#dfe9ff;text-shadow:0 0 22px rgba(120,180,255,.6);opacity:0}

  /* ── Éclaboussures ── */
  #eclats{position:absolute;inset:0;pointer-events:none}
</style>

<div id="scene">
  <div id="ciel"></div>
  <div id="rayons"></div>
  <svg id="montagnes" viewBox="0 0 1080 280" preserveAspectRatio="none"></svg>
  <div id="brume"></div>
  <div id="sol">
    <div id="titre"></div>
  </div>
  <div id="mer">
    <canvas id="eau" width="1080" height="454"></canvas>
    <div id="horizon"></div>
    <div id="reflet"></div>
  </div>
  <canvas id="ruban" width="1080" height="1080"></canvas>
  <canvas id="eclats" width="1080" height="1080"></canvas>
  <div id="sous">Pharmacie Rhazlaoui · Khouribga</div>
</div>

<script>
/* ═══════════════ Réglages ═══════════════ */
const TEXTE = "LA PARA RHAZLAOUI";
const DUREE = 10;            // secondes
const L = 1080;              // côté du carré
const MER_Y = 0.58 * L;      // hauteur de la ligne d'eau en pixels

/* ═══════════════ Utilitaires ═══════════════ */
const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
const lerp  = (a, b, t) => a + (b - a) * t;
/* Sortie très douce : la lettre décélère en arrivant à sa place. */
const adouci = t => 1 - Math.pow(1 - clamp(t), 3);
const adouciFort = t => 1 - Math.pow(1 - clamp(t), 5);
/* Aléatoire DÉTERMINISTE : même graine ⇒ même valeur à chaque rendu. */
function alea(n){ const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ═══════════════ Montagnes (dessinées une fois) ═══════════════ */
(function montagnes(){
  const svg = document.getElementById("montagnes");
  let d = "M0,280 L0,190 ";
  for (let x = 0; x <= 1080; x += 30) {
    const h = 150
      + Math.sin(x * 0.011) * 42
      + Math.sin(x * 0.027 + 1.3) * 26
      + alea(x) * 16;
    d += `L${x},${280 - h} `;
  }
  d += "L1080,280 Z";
  svg.innerHTML =
    `<defs><linearGradient id="m" x1="0" y1="0" x2="0" y2="1">
       <stop offset="0" stop-color="#2b4a7d"/><stop offset="1" stop-color="#0b1a33"/>
     </linearGradient></defs>
     <path d="${d}" fill="url(#m)"/>`;
})();

/* ═══════════════ Rayons (créés une fois) ═══════════════ */
const RAYONS = [];
(function rayons(){
  const hote = document.getElementById("rayons");
  for (let i = 0; i < 9; i++) {
    const r = document.createElement("div");
    r.className = "rayon";
    r.style.left = (6 + i * 11 + alea(i) * 5) + "%";
    r.dataset.angle = (-26 + i * 6.5 + alea(i + 40) * 4).toFixed(2);
    r.dataset.phase = (alea(i + 70) * 6.28).toFixed(3);
    hote.appendChild(r);
    RAYONS.push(r);
  }
})();

/* ═══════════════ Lettres ═══════════════ */
const LIGNES = ["LA PARA", "RHAZLAOUI"];   // deux lignes : tient dans un carré
const MARGE = 0.90;                        // le texte occupe au plus 90 % de la largeur
const INTERLIGNE = 1.02;                   // hauteur d'une ligne, en corps de police

/* Chaque entrée décrit une lettre : son glyphe, sa ligne, son rang global. */
const CARS = [];
LIGNES.forEach((mot, ligne) => {
  mot.split("").forEach((c) => CARS.push({ c, ligne }));
});

const lettres = [], reflets = [];
const AVANCE = [];      // position horizontale finale de chaque lettre
const HAUTEUR = [];     // position verticale finale de chaque lettre
let TAILLE = 150;       // corps de police, ajusté juste après la mesure

(function fabriqueLettres(){
  const titre  = document.getElementById("titre");
  const reflet = document.getElementById("reflet");

  CARS.forEach(({ c }) => {
    const s = document.createElement("span");
    s.className = "lettre";
    s.textContent = c === " " ? "\u00A0" : c;
    s.style.fontSize = TAILLE + "px";
    titre.appendChild(s);
    lettres.push(s);

    const r = document.createElement("span");
    r.className = "lettre-r";
    r.textContent = c === " " ? "\u00A0" : c;
    r.style.fontSize = TAILLE + "px";
    reflet.appendChild(r);
    reflets.push(r);
  });

  // 1) Mesure des glyphes au corps provisoire.
  const brut = lettres.map((el, i) =>
    el.getBoundingClientRect().width + (CARS[i].c === " " ? 0.10 * TAILLE : 0.05 * TAILLE));

  // 2) La ligne la plus large impose l'échelle : on rétrécit jusqu'à tenir.
  const largeurLigne = LIGNES.map((_, l) =>
    brut.reduce((somme, w, i) => somme + (CARS[i].ligne === l ? w : 0), 0));
  const facteur = Math.min(1, (L * MARGE) / Math.max(...largeurLigne));
  TAILLE = Math.round(TAILLE * facteur);

  lettres.forEach(el => { el.style.fontSize = TAILLE + "px"; });
  reflets.forEach(el => { el.style.fontSize = TAILLE + "px"; });

  // 3) Positions finales : chaque ligne centrée, empilées verticalement.
  const larg = brut.map(w => w * facteur);
  const largeurFinale = largeurLigne.map(w => w * facteur);
  const curseurs = largeurFinale.map(w => -w / 2);
  const hautTotal = (LIGNES.length - 1) * TAILLE * INTERLIGNE;

  CARS.forEach(({ ligne }, i) => {
    AVANCE.push(curseurs[ligne] + larg[i] / 2);
    curseurs[ligne] += larg[i];
    HAUTEUR.push(ligne * TAILLE * INTERLIGNE - hautTotal / 2);
  });
})();

/* ═══════════════ Mer ═══════════════ */
const eau = document.getElementById("eau").getContext("2d");
function dessineMer(t){
  const W = 1080, H = 454;
  eau.clearRect(0, 0, W, H);

  // Vaguelettes en perspective : plus serrées près de l'horizon.
  for (let i = 0; i < 60; i++) {
    const p = i / 59;
    const y = Math.pow(p, 2.1) * H;
    const amp = 2 + p * 9;
    const op = (0.05 + p * 0.16) * (0.75 + 0.25 * Math.sin(t * 1.6 + i));
    eau.beginPath();
    for (let x = 0; x <= W; x += 12) {
      const yy = y
        + Math.sin(x * 0.012 + t * 1.5 + i * 0.5) * amp
        + Math.sin(x * 0.031 - t * 2.1 + i) * amp * 0.45;
      x === 0 ? eau.moveTo(x, yy) : eau.lineTo(x, yy);
    }
    eau.strokeStyle = `rgba(150,200,255,${op})`;
    eau.lineWidth = 1 + p * 1.6;
    eau.stroke();
  }

  // Colonne de lumière dorée sous le titre (reflet spéculaire).
  const g = eau.createLinearGradient(W / 2, 0, W / 2, H);
  g.addColorStop(0, "rgba(255,205,115,.17)");
  g.addColorStop(0.45, "rgba(255,190,90,.05)");
  g.addColorStop(1, "rgba(255,180,70,0)");
  eau.fillStyle = g;
  eau.beginPath();
  eau.moveTo(W / 2 - 150, 0);
  eau.lineTo(W / 2 + 150, 0);
  eau.lineTo(W / 2 + 430, H);
  eau.lineTo(W / 2 - 430, H);
  eau.closePath();
  eau.filter = 'blur(22px)';
  eau.fill();
  eau.filter = 'none';

  // Scintillements.
  for (let i = 0; i < 170; i++) {
    const p = alea(i) ;
    const y = Math.pow(p, 2.0) * H;
    const x = alea(i + 500) * W + Math.sin(t * 1.1 + i) * 6;
    const clignote = 0.5 + 0.5 * Math.sin(t * (3 + alea(i + 900) * 5) + i * 2.1);
    const r = (0.6 + p * 1.9) * (0.5 + clignote);
    const dore = Math.abs(x - W / 2) < 220 && p > 0.25;
    eau.fillStyle = dore
      ? `rgba(255,214,130,${0.12 + clignote * 0.5})`
      : `rgba(190,225,255,${0.06 + clignote * 0.28})`;
    eau.beginPath();
    eau.arc(x, y, r, 0, 6.2832);
    eau.fill();
  }

  // Ondes concentriques au point d'émergence.
  const centreX = W / 2, centreY = 26;
  for (let k = 0; k < 5; k++) {
    const age = ((t * 0.55 + k * 0.2) % 1);
    const rx = 60 + age * 430, ry = (60 + age * 430) * 0.16;
    eau.beginPath();
    eau.ellipse(centreX, centreY + age * 40, rx, ry, 0, 0, 6.2832);
    eau.strokeStyle = `rgba(180,220,255,${(1 - age) * 0.30})`;
    eau.lineWidth = 2;
    eau.stroke();
  }
}

/* ═══════════════ Ruban hélicoïdal ═══════════════ */
const ruban = document.getElementById("ruban").getContext("2d");
function dessineRuban(t, avancement){
  ruban.clearRect(0, 0, L, L);
  if (avancement <= 0.01) return;

  const baseY = MER_Y + 16;      // départ : la surface de l'eau
  const hautY = MER_Y - 470;     // arrivée : au-dessus du texte
  const tours = 2.6;

  for (const [ep, alpha, decal] of [[9, 0.20, 0], [4.5, 0.55, 0], [1.8, 0.95, 0.06]]) {
    ruban.beginPath();
    const n = 260;
    const visible = Math.floor(n * clamp(avancement));
    for (let i = 0; i <= visible; i++) {
      const p = i / n;
      const angle = p * tours * 6.2832 + t * 1.15 + decal * 6.28;
      const rayon = (215 - p * 40) * Math.sin(Math.PI * clamp(p * 1.05, 0, 1)) + 46;
      const x = L / 2 + Math.cos(angle) * rayon;
      const y = lerp(baseY, hautY, p) + Math.sin(angle) * rayon * 0.15;
      i === 0 ? ruban.moveTo(x, y) : ruban.lineTo(x, y);
    }
    ruban.strokeStyle = `rgba(255,205,105,${alpha * clamp(avancement * 1.4)})`;
    ruban.lineWidth = ep;
    ruban.lineCap = "round";
    ruban.shadowColor = "rgba(255,190,80,.9)";
    ruban.shadowBlur = ep * 3;
    ruban.stroke();
  }
  ruban.shadowBlur = 0;

  // Perles d'or qui suivent l'hélice.
  for (let k = 0; k < 7; k++) {
    const p = ((t * 0.16 + k / 7) % 1) * clamp(avancement);
    const angle = p * tours * 6.2832 + t * 1.15;
    const rayon = (215 - p * 40) * Math.sin(Math.PI * clamp(p * 1.05, 0, 1)) + 46;
    const x = L / 2 + Math.cos(angle) * rayon;
    const y = lerp(baseY, hautY, p) + Math.sin(angle) * rayon * 0.15;
    const r = 5 + 5 * Math.sin(p * Math.PI);
    const g = ruban.createRadialGradient(x - r * .3, y - r * .3, r * .2, x, y, r);
    g.addColorStop(0, "#fffdf0"); g.addColorStop(.5, "#f5c95c"); g.addColorStop(1, "#9c6f16");
    ruban.fillStyle = g;
    ruban.shadowColor = "rgba(255,200,90,.9)"; ruban.shadowBlur = 18;
    ruban.beginPath(); ruban.arc(x, y, r, 0, 6.2832); ruban.fill();
  }
  ruban.shadowBlur = 0;
}

/* ═══════════════ Éclaboussures ═══════════════ */
const eclats = document.getElementById("eclats").getContext("2d");
function dessineEclats(t){
  eclats.clearRect(0, 0, L, L);
  for (let i = 0; i < 90; i++) {
    const naissance = 0.5 + alea(i) * 5.2;          // instant de projection
    const vie = 1.5 + alea(i + 33) * 1.4;
    const age = (t - naissance) / vie;
    if (age < 0 || age > 1) continue;
    const dir = (alea(i + 7) - 0.5) * 2;
    const v0 = 150 + alea(i + 13) * 330;
    const x = L / 2 + dir * v0 * age * 0.85;
    const y = MER_Y + 10 - (v0 * 1.35 * age - 620 * age * age);
    const r = (1.6 + alea(i + 21) * 3.4) * (1 - age * 0.55);
    const op = (1 - age) * 0.85;
    eclats.fillStyle = alea(i + 55) > 0.7
      ? `rgba(255,214,130,${op})`
      : `rgba(205,235,255,${op})`;
    eclats.beginPath(); eclats.arc(x, y, r, 0, 6.2832); eclats.fill();
  }
}

/* ═══════════════ Placement des lettres ═══════════════ */
function poseLettres(t){
  const RAYON = 300;          // rayon de l'hélice au départ
  const PROF  = 150;          // profondeur sous la surface
  const dep   = 0.55;         // instant de la première lettre
  const pas   = 0.155;        // décalage entre deux lettres
  const duree = 1.9;          // temps de montée d'une lettre

  let dernier = 0;
  CARS.forEach((_, i) => {
    const e  = clamp((t - (dep + i * pas)) / duree);
    const ea = adouci(e);
    dernier = Math.max(dernier, e);

    // Position finale : la ligne de texte, centrée.
    const xf = AVANCE[i];
    const yf = HAUTEUR[i];

    // Hélice : l'angle et le rayon se referment à mesure que la lettre monte.
    const spires = 2.25;
    const angle  = (1 - ea) * (spires * 360) + (1 - ea) * i * 26;
    const rayon  = (1 - adouciFort(e)) * RAYON;

    // Montée : part sous l'eau, arrive à sa place.
    const yy = lerp(PROF + 240, yf, ea);

    // Opacité : la lettre apparaît en perçant la surface.
    const op = clamp(e * 3.2);

    const l = lettres[i];
    l.style.opacity = op;
    l.style.transform =
      `translate3d(${xf}px, ${yy}px, 0px) ` +
      `rotateY(${angle}deg) translateZ(${rayon}px) ` +
      `rotateX(${(1 - ea) * -18}deg) scale(${lerp(0.55, 1, ea)})`;

    // Reflet : même chose, retourné, sous la ligne d'eau.
    const r = reflets[i];
    // #reflet part du haut de la mer : le reflet est le miroir du texte
    // par rapport à la ligne d'eau, donc d'autant plus bas que la lettre est haute.
    const hauteurAuDessus = MER_Y - (0.38 * L + yy);
    const refletY = hauteurAuDessus * 0.30 + 8;
    r.style.opacity = op * 0.45 * ea;
    r.style.transform =
      `translate3d(${xf}px, ${refletY}px, 0px) ` +
      `rotateY(${angle}deg) scaleY(-1) scale(${lerp(0.55, 1, ea)})`;
  });
  return dernier;
}

/* ═══════════════ Fonction maîtresse ═══════════════ */
window.poser = function(t){
  // Rayons : léger balancement.
  RAYONS.forEach((r, i) => {
    const a = parseFloat(r.dataset.angle), ph = parseFloat(r.dataset.phase);
    r.style.transform = `rotate(${a + Math.sin(t * 0.5 + ph) * 1.6}deg)`;
    r.style.opacity = 0.30 + 0.22 * Math.sin(t * 0.7 + ph);
  });

  dessineMer(t);
  const avancement = poseLettres(t);
  dessineRuban(t, clamp((t - 0.7) / 3.4) * (1 - adouci(clamp((t - 7.2) / 2.0)) * 0.9));
  dessineEclats(t);

  // Titre : légère pulsation de la lueur une fois posé.
  const titre = document.getElementById("titre");
  const pose = clamp((t - 4.6) / 1.2);
  titre.style.filter = `drop-shadow(0 0 ${18 + 16 * pose * (0.6 + 0.4 * Math.sin(t * 2))}px rgba(255,200,90,${0.35 + 0.3 * pose}))`;

  // Sous-titre : arrive quand le nom est lisible.
  document.getElementById("sous").style.opacity = adouci(clamp((t - 6.4) / 1.3)) * 0.95;

  // Fondu d'ouverture et de fermeture.
  document.getElementById("scene").style.opacity =
    clamp(t / 0.5) * clamp((DUREE - t) / 0.55);
};

window.poser(0);
</script>
</html>
