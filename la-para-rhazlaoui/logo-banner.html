<title>Logo Banner</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@1,500;0,500&display=swap">
<style>
  :root{
    --grad:linear-gradient(178deg,#F3E1A6 0%,#E7C46E 34%,#C99A45 68%,#A67C30 100%);
  }
  *{box-sizing:border-box;margin:0}
  body{background:#0d1109;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px}
  .banner{
    width:1500px;max-width:100%;aspect-ratio:1500/470;position:relative;overflow:hidden;border-radius:12px;
    background:
      radial-gradient(120% 160% at 20% 0%, #47593d 0%, #33412b 34%, #232c1d 70%, #182013 100%);
    box-shadow:inset 0 0 0 1px #c9a96a33, inset 0 0 120px #00000055;
    display:flex;align-items:center;gap:46px;padding:0 60px}
  /* faint zellige-like vignette */
  .banner::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(140% 120% at 50% 40%,transparent 55%,#00000055 100%)}
  .orb{position:relative;flex:none;width:260px;height:260px;border-radius:50%;
    background:
      radial-gradient(circle at 36% 26%, #7d9469 0%, #4c5f42 40%, #2b3623 72%, #1a2214 100%);
    box-shadow:
      inset 0 6px 10px #ffffff2e, inset 0 -22px 40px #00000070,
      0 26px 50px -20px #000a, 0 0 0 2px #c9a96a4d, 0 0 0 7px #ffffff08;
    display:flex;align-items:center;justify-content:center;z-index:2}
  .orb::before{content:"";position:absolute;top:26px;left:58px;width:96px;height:52px;border-radius:50%;
    background:radial-gradient(circle,#ffffff70,transparent 70%);filter:blur(3px)}
  .orb::after{content:"";position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
    width:13px;height:13px;border-radius:50%;background:#e9cf86;box-shadow:0 0 14px #e9cf86cc}
  .orb .ltr{position:relative;font-family:"Cinzel Decorative",serif;font-weight:900;font-size:146px;line-height:1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 2px #000a) drop-shadow(0 0 18px #c9a96a44);z-index:2}
  .orb .swash{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);width:130px;height:24px;z-index:1}
  .lock{position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;min-width:0}
  .rule{width:100%;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,#caa456 12%,#f0d891 50%,#caa456 88%,transparent)}
  .name{font-family:"Cinzel Decorative",serif;font-weight:900;letter-spacing:.02em;line-height:1;
    font-size:70px;white-space:nowrap;margin:18px 0 20px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 1px #0009) drop-shadow(0 6px 10px #0006)}
  .tag{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:39px;letter-spacing:.04em;
    color:#e9dcbb;text-shadow:0 1px 2px #0008;white-space:nowrap}
  .tag b{color:#eccd7f;font-weight:500}
  @media(max-width:820px){.banner{gap:30px;padding:0 34px}.orb{width:180px;height:180px}.orb .ltr{font-size:104px}
    .name{font-size:62px}.tag{font-size:22px}}
</style>
<div class="banner">
  <div class="orb">
    <span class="ltr">R</span>
    <svg class="swash" viewBox="0 0 150 26" fill="none">
      <path d="M6 13 C 40 2, 55 24, 75 13 C 95 2, 110 24, 144 13" stroke="#e9cf86" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      <circle cx="75" cy="13" r="2.6" fill="#f0d891"/>
    </svg>
  </div>
  <div class="lock">
    <div class="rule"></div>
    <div class="name">LA&nbsp;PARA&nbsp;RHAZLAOUI</div>
    <div class="rule"></div>
    <div class="tag" style="margin-top:20px">Parapharmacie&nbsp;·&nbsp;Dermocosmétique&nbsp;·&nbsp;<b>Soin</b>&nbsp;·&nbsp;Bien-être</div>
  </div>
</div>
